name: Update README cards

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: npm ci --omit=dev --no-audit --no-fund --prefix tools/cool-readme
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: node tools/cool-readme/src/cli.ts --config cool-readme.yml --out "$RUNNER_TEMP/cards"
      # The cards live on their own branch, as one commit replaced on each change, so they don't add to main's history.
      - name: Publish the cards on the cards branch
        run: |
          git fetch --quiet --depth 1 origin cards:refs/remotes/origin/cards 2>/dev/null || true # not there on the first run
          git switch --quiet --orphan cards
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add -- *.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Update README cards'
          if git rev-parse --quiet --verify origin/cards >/dev/null && git diff --quiet origin/cards HEAD; then
            echo "No changes"
            exit 0
          fi
          git push --force origin cards
